name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which slices of the monorepo changed so we can skip jobs.
  # Doc-only PRs (or tests-only, or configs-only) land much faster.
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      rust: ${{ steps.filter.outputs.rust }}
      e2e-relevant: ${{ steps.filter.outputs.e2e-relevant }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - 'biome.jsonc'
              - 'tests/**'
              - 'playwright.config.ts'
            backend:
              - 'backend/**'
            rust:
              - 'src-tauri/**'
            e2e-relevant:
              - 'src/**'
              - 'backend/**'
              - 'tests/e2e/**'
              - 'playwright.config.ts'

  lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sofi
          POSTGRES_PASSWORD: sofi
          POSTGRES_DB: sofi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sofi -d sofi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mock-oauth:
        image: ghcr.io/navikt/mock-oauth2-server:2.1.10
        ports: ['8081:8080']
        env:
          JSON_CONFIG: '{"interactiveLogin":false,"tokenCallbacks":[{"issuerId":"google","tokenExpiry":3600,"requestMappings":[{"requestParam":"grant_type","match":"authorization_code","claims":{"sub":"google-sub-001","email":"oauth-test@test.sofi.local","email_verified":true,"name":"OAuth Test User"}}]},{"issuerId":"github","tokenExpiry":3600,"requestMappings":[{"requestParam":"grant_type","match":"authorization_code","claims":{"sub":"github-sub-001","email":"oauth-test@test.sofi.local","name":"OAuth Test User"}}]}]}'
    env:
      DATABASE_URL: postgres://sofi:sofi@localhost:5432/sofi_test
      DJANGO_SETTINGS_MODULE: sofi_api.settings.test
      DJANGO_SECRET_KEY: test-only-secret-not-used-for-anything-real
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - run: uv sync --frozen
      # pytest-django creates + migrates its own `test_sofi_test` DB; no
      # pre-migrate of `sofi_test` needed for this job.
      - run: uv run pytest -q
      - name: OAuth tests (against mock-oauth)
        run: uv run pytest apps/users/tests/test_oauth.py --ds=sofi_api.settings.test_oauth -q

  backend-throttling:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sofi
          POSTGRES_PASSWORD: sofi
          POSTGRES_DB: sofi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sofi -d sofi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sofi:sofi@localhost:5432/sofi_test
      DJANGO_SETTINGS_MODULE: sofi_api.settings.test_throttled
      DJANGO_SECRET_KEY: test-only-secret-not-used-for-anything-real
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
      - run: uv sync --frozen
      - run: uv run pytest -m throttling --ds=sofi_api.settings.test_throttled -q

  rust-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  e2e-web:
    needs: [changes, backend-tests]
    # Run iff relevant code changed. `always()` + `!failure()` lets this
    # skip cleanly when paths-filter ruled out its prerequisites. Not
    # gated on `lint`: biome style is independent of runtime behaviour.
    if: always() && needs.changes.outputs.e2e-relevant == 'true' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sofi
          POSTGRES_PASSWORD: sofi
          POSTGRES_DB: sofi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sofi -d sofi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mock-oauth:
        image: ghcr.io/navikt/mock-oauth2-server:2.1.10
        ports: ['8081:8080']
        env:
          JSON_CONFIG: '{"interactiveLogin":false,"tokenCallbacks":[{"issuerId":"google","tokenExpiry":3600,"requestMappings":[{"requestParam":"grant_type","match":"authorization_code","claims":{"sub":"google-sub-001","email":"oauth-test@test.sofi.local","email_verified":true,"name":"OAuth Test User"}}]},{"issuerId":"github","tokenExpiry":3600,"requestMappings":[{"requestParam":"grant_type","match":"authorization_code","claims":{"sub":"github-sub-001","email":"oauth-test@test.sofi.local","name":"OAuth Test User"}}]}]}'
    env:
      DATABASE_URL: postgres://sofi:sofi@localhost:5432/sofi_test
      DJANGO_SETTINGS_MODULE: sofi_api.settings.test_oauth   # was: settings.test
      DJANGO_SECRET_KEY: test-only-secret-not-used-for-anything-real
      VITE_SOFI_API_BASE: http://127.0.0.1:8000
      VITE_GOOGLE_CLIENT_ID: oauth-stub
      VITE_GITHUB_CLIENT_ID: oauth-stub
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run python manage.py migrate --noinput
        working-directory: backend

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # Explicit --project so the tauri-native project doesn't run on Linux
      # (it shells out to `open sofi://…` which is macOS-only; nightly job
      # covers tauri-native on macos-14).
      - run: pnpm exec playwright test --project=chromium-auth

      - name: Upload Playwright report on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
