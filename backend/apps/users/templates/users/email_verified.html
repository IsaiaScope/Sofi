<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>Email verified — Sofi</title>
<style>
  :root {
    --bg: #0a0a12;
    --surface: #12121e;
    --border: rgba(255, 255, 255, 0.08);
    --text: rgba(255, 255, 255, 0.92);
    --text-muted: rgba(255, 255, 255, 0.5);
    --violet: #7c3aed;
    --violet-hover: #8b5cf6;
    --success: #10b981;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #faf9ff;
      --surface: #ffffff;
      --border: rgba(0, 0, 0, 0.08);
      --text: rgba(0, 0, 0, 0.92);
      --text-muted: rgba(0, 0, 0, 0.55);
      --violet: #6b21d8;
      --violet-hover: #7c3aed;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 1rem;
    padding: 2.5rem 2rem;
    max-width: 28rem;
    width: 100%;
    text-align: center;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }
  .wordmark {
    font-family: "Space Grotesk", "Inter", sans-serif;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, var(--violet) 0%, var(--violet-hover) 50%, var(--violet) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0 0 1.5rem;
  }
  .check {
    width: 3.5rem;
    height: 3.5rem;
    margin: 0 auto 1.25rem;
    border-radius: 999px;
    background: rgba(16, 185, 129, 0.12);
    color: var(--success);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.75rem;
    line-height: 1;
  }
  h1 {
    font-size: 1.375rem;
    font-weight: 600;
    margin: 0 0 0.5rem;
    color: var(--text);
  }
  p {
    font-size: 1rem;
    line-height: 1.5;
    color: var(--text-muted);
    margin: 0 0 1.75rem;
  }
  .button {
    display: inline-block;
    background: var(--violet);
    color: #ffffff;
    font-weight: 600;
    font-size: 1rem;
    padding: 0.75rem 1.5rem;
    border-radius: 0.625rem;
    text-decoration: none;
    transition: background 120ms ease;
  }
  .button:hover { background: var(--violet-hover); }
  .button:focus-visible {
    outline: 2px solid var(--violet-hover);
    outline-offset: 2px;
  }
  .hint {
    font-size: 0.9375rem;
    color: var(--text-muted);
    margin: 1.5rem 0 0;
  }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="wordmark">Sofi</div>
    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>Email verified</h1>
    <p>Your account is ready. Return to Sofi and sign in with your credentials.</p>
    <a class="button" href="sofi://verify-success">Return to Sofi</a>
    <p class="hint">If nothing happens, make sure the Sofi desktop app is installed, then open it manually and sign in.</p>
  </div>
</main>
</body>
</html>
