[project]
name = "sofi-api"
version = "0.1.0"
description = "Sofi backend — Django + DRF auth and domain API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dj-rest-auth>=7.2.0",
    "django>=5.2,<6",
    "django-allauth[socialaccount]>=65.16.0",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.13.0",
    "django-rest-knox>=5.0.4",
    "djangorestframework>=3.17.1",
    "psycopg[binary]>=3.3.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sofi_api.settings.dev"
python_files = ["tests_*.py", "test_*.py", "*_tests.py"]
