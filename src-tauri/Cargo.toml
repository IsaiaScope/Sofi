[package]
name = "sofi"
version = "0.21.3"
description = "Sofi — Agent Command Center"
authors = ["IsaiaScope"]
edition = "2021"

[lib]
name = "sofi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Sofi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-oauth = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Platform-native features are OPT-IN in keyring v3. Without them, the crate
# falls back to a no-op mock store that silently loses writes — token storage
# appears to succeed but subsequent reads return empty.
keyring = { version = "3", features = ["apple-native", "linux-native-sync-persistent", "windows-native"] }
tokio = { version = "1", features = ["full"] }
url = "2"
thiserror = "2"
portable-pty = "0.8"
git2 = "0.19"
log = "0.4"
