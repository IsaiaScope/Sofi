<svg xmlns="http://www.w3.org/2000/svg" viewBox="139 56 237 400" fill="none">
  <defs>
    <linearGradient id="flame-grad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3a3a52"/>
      <stop offset="100%" stop-color="#121220"/>
    </linearGradient>
    <!-- Gradient spans both rows, repeating the pattern per row -->
    <linearGradient id="letter-grad" gradientUnits="userSpaceOnUse" x1="0" y1="34" x2="0" y2="457">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="24%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="76%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="neon-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#8b5cf6" flood-opacity="0.25"/>
    </filter>
    <filter id="text-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- All letters in single coordinate space for merged outlines -->
  <g transform="translate(256, 256) scale(0.9) translate(-186.75, -242.75)">
    <g filter="url(#neon-glow)">
      <g filter="url(#text-shadow)">

        <!-- Pass 1: Dark purple outline (all 4 letters) -->
        <!-- S (top-left) -->
        <g transform="translate(93, 0)">
          <path d="M91 55 L50 55 C8 55 -2 78 -2 98 C-2 118 12 141 45 141 C78 141 92 164 92 184 C92 204 78 227 40 227 L-1 227"
            fill="none" stroke="#4c1d95" stroke-width="42" stroke-linejoin="round" stroke-linecap="round"/>
        </g>
        <!-- O (top-right) -->
        <g transform="translate(186, 0)">
          <ellipse cx="55" cy="141" rx="56" ry="96" fill="#4c1d95" stroke="#4c1d95" stroke-width="13" paint-order="stroke"/>
        </g>
        <!-- F (bottom-left) -->
        <g transform="translate(76.75, 203)">
          <path d="M18 240 C8 240 0 232 0 222 L0 60 C0 50 8 42 18 42 L102 42 C112 42 118 50 118 60 C118 70 112 78 102 78 L48 78 Q38 78 38 88 L38 114 Q38 124 48 124 L84 124 C94 124 100 132 100 142 C100 152 94 160 84 160 L48 160 Q38 160 38 170 L38 222 C38 232 30 240 18 240 Z"
            fill="#4c1d95" stroke="#4c1d95" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke"/>
        </g>
        <!-- I (bottom-right) -->
        <g transform="translate(225.75, 203)">
          <path d="M18 108 L-10 232 C-12 238 -8 242 -2 242 L38 242 C44 242 48 238 46 232 L18 100 Z"
            fill="#4c1d95" stroke="#4c1d95" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke"/>
          <ellipse cx="18" cy="94" rx="34" ry="30" fill="#4c1d95" stroke="#4c1d95" stroke-width="13" paint-order="stroke"/>
          <circle cx="-19" cy="58" r="16" fill="#4c1d95" stroke="#4c1d95" stroke-width="13" paint-order="stroke"/>
          <circle cx="18" cy="58" r="16" fill="#4c1d95" stroke="#4c1d95" stroke-width="13" paint-order="stroke"/>
          <circle cx="55" cy="58" r="16" fill="#4c1d95" stroke="#4c1d95" stroke-width="13" paint-order="stroke"/>
        </g>

        <!-- Pass 2: Gradient fill (all 4 letters) -->
        <!-- S -->
        <g transform="translate(93, 0)">
          <path d="M91 55 L50 55 C8 55 -2 78 -2 98 C-2 118 12 141 45 141 C78 141 92 164 92 184 C92 204 78 227 40 227 L-1 227"
            fill="none" stroke="url(#letter-grad)" stroke-width="38" stroke-linejoin="round" stroke-linecap="round"/>
        </g>
        <!-- O -->
        <g transform="translate(186, 0)">
          <ellipse cx="55" cy="141" rx="56" ry="96" fill="url(#letter-grad)" stroke="url(#letter-grad)" stroke-width="9" paint-order="stroke"/>
        </g>
        <!-- F -->
        <g transform="translate(76.75, 203)">
          <path d="M18 240 C8 240 0 232 0 222 L0 60 C0 50 8 42 18 42 L102 42 C112 42 118 50 118 60 C118 70 112 78 102 78 L48 78 Q38 78 38 88 L38 114 Q38 124 48 124 L84 124 C94 124 100 132 100 142 C100 152 94 160 84 160 L48 160 Q38 160 38 170 L38 222 C38 232 30 240 18 240 Z"
            fill="url(#letter-grad)" stroke="url(#letter-grad)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke"/>
        </g>
        <!-- I -->
        <g transform="translate(225.75, 203)">
          <path d="M18 108 L-10 232 C-12 238 -8 242 -2 242 L38 242 C44 242 48 238 46 232 L18 100 Z"
            fill="url(#letter-grad)" stroke="url(#letter-grad)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke"/>
          <ellipse cx="18" cy="94" rx="34" ry="30" fill="url(#letter-grad)" stroke="url(#letter-grad)" stroke-width="9" paint-order="stroke"/>
          <circle cx="-19" cy="58" r="16" fill="url(#letter-grad)" stroke="url(#letter-grad)" stroke-width="9" paint-order="stroke"/>
          <circle cx="18" cy="58" r="16" fill="url(#letter-grad)" stroke="url(#letter-grad)" stroke-width="9" paint-order="stroke"/>
          <circle cx="55" cy="58" r="16" fill="url(#letter-grad)" stroke="url(#letter-grad)" stroke-width="9" paint-order="stroke"/>
        </g>

      </g>
    </g>

    <!-- Flame inside O -->
    <g transform="translate(241, 141)" filter="url(#text-shadow)">
      <g transform="scale(5.5)">
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"
          fill="url(#flame-grad)" transform="translate(-12, -12)"/>
      </g>
    </g>
  </g>
</svg>
