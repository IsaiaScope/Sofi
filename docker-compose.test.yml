# Test-only services. Used by `pnpm test:e2e` locally and by CI jobs that
# need OAuth coverage. Run alongside the main docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
#
# CI jobs reference the same image via `services:` blocks rather than
# loading this file — kept here for local-dev parity.

services:
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8081:8080"
    environment:
      # JSON config inline. Defines two issuers ("google", "github") so
      # allauth's per-provider client config maps cleanly.
      #
      # requestMappings matches against the token endpoint request parameters.
      # "grant_type":"authorization_code" triggers the claim injection for
      # every code exchange regardless of scope.
      JSON_CONFIG: >
        {
          "interactiveLogin": false,
          "tokenCallbacks": [
            {
              "issuerId": "google",
              "tokenExpiry": 3600,
              "requestMappings": [
                { "requestParam": "grant_type", "match": "authorization_code", "claims": { "sub": "google-sub-001", "email": "oauth-test@test.sofi.local", "email_verified": true, "name": "OAuth Test User" } }
              ]
            },
            {
              "issuerId": "github",
              "tokenExpiry": 3600,
              "requestMappings": [
                { "requestParam": "grant_type", "match": "authorization_code", "claims": { "sub": "github-sub-001", "email": "oauth-test@test.sofi.local", "name": "OAuth Test User" } }
              ]
            }
          ]
        }
